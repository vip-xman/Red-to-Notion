<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景和标题 -->
  <rect width="800" height="600" fill="#f8f9fa" />
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Red To Notion 架构图</text>

  <!-- 组件框 -->
  <!-- 小红书页面 -->
  <rect x="50" y="100" width="200" height="150" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" />
  <text x="150" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">小红书页面</text>
  <text x="150" y="160" font-family="Arial" font-size="14" text-anchor="middle">Xiaohongshu.com</text>
  <text x="150" y="190" font-family="Arial" font-size="14" text-anchor="middle">content.js</text>
  <text x="150" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">内容提取脚本</text>

  <!-- 弹出界面 -->
  <rect x="300" y="100" width="200" height="150" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" />
  <text x="400" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">弹出界面</text>
  <text x="400" y="160" font-family="Arial" font-size="14" text-anchor="middle">popup.html</text>
  <text x="400" y="190" font-family="Arial" font-size="14" text-anchor="middle">popup.js</text>
  <text x="400" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">用户交互界面</text>

  <!-- 后台服务 -->
  <rect x="550" y="100" width="200" height="150" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2" />
  <text x="650" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">后台服务</text>
  <text x="650" y="160" font-family="Arial" font-size="14" text-anchor="middle">background.js</text>
  <text x="650" y="190" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Service Worker</text>
  <text x="650" y="220" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">API交互处理</text>

  <!-- Notion API -->
  <rect x="550" y="300" width="200" height="100" rx="10" fill="#ede7f6" stroke="#9c27b0" stroke-width="2" />
  <text x="650" y="330" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Notion API</text>
  <text x="650" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">notion.so/api</text>

  <!-- 配置存储 -->
  <rect x="300" y="300" width="200" height="100" rx="10" fill="#e0f7fa" stroke="#00acc1" stroke-width="2" />
  <text x="400" y="330" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">配置存储</text>
  <text x="400" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">manifest.json</text>
  <text x="400" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Chrome本地存储</text>

  <!-- 数据流箭头 -->
  <!-- 小红书 -> 弹出界面 -->
  <path d="M250 175 L300 175" stroke="#2196f3" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="275" y="165" font-family="Arial" font-size="12" text-anchor="middle" fill="#2196f3">内容数据</text>

  <!-- 弹出界面 -> 后台服务 -->
  <path d="M500 175 L550 175" stroke="#4caf50" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="525" y="165" font-family="Arial" font-size="12" text-anchor="middle" fill="#4caf50">剪藏请求</text>

  <!-- 后台服务 -> Notion API -->
  <path d="M650 250 L650 300" stroke="#ff9800" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="670" y="275" font-family="Arial" font-size="12" text-anchor="start" fill="#ff9800">API调用</text>

  <!-- 配置存储 -> 后台服务 -->
  <path d="M400 300 L400 250" stroke="#00acc1" stroke-width="2" marker-end="url(#arrowhead)" />
  <path d="M400 250 L550 250 L550 225" stroke="#00acc1" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="450" y="240" font-family="Arial" font-size="12" text-anchor="middle" fill="#00acc1">配置数据</text>

  <!-- Notion API -> 后台服务 -->
  <path d="M650 400 L650 450 L550 450 L550 275" stroke="#9c27b0" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="670" y="425" font-family="Arial" font-size="12" text-anchor="start" fill="#9c27b0">响应结果</text>

  <!-- 后台服务 -> 弹出界面 -->
  <path d="M550 175 L500 175" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)" />
  <text x="525" y="185" font-family="Arial" font-size="12" text-anchor="middle" fill="#ff9800">状态反馈</text>

  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="currentColor" />
    </marker>
  </defs>

  <!-- 底部说明 -->
  <text x="400" y="550" font-family="Arial" font-size="14" text-anchor="middle" font-style="italic">Red To Notion 数据流与组件交互图</text>
</svg>