<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
    }

    /* 头部区域 */
    .header {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .title {
      font-size: 18px;
      font-weight: bold;
      margin: 0;
    }

    /* 主内容区域 */
    .main-content {
      padding: 20px;
    }

    /* 状态消息 */
    .status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
    }
    .status.info { background-color: #e3f2fd; color: #1976d2; }
    .status.success { background-color: #e8f5e8; color: #2e7d32; }
    .status.error { background-color: #ffebee; color: #c62828; }

    /* 未登录状态 */
    .login-section {
      text-align: center;
      padding: 30px 20px;
    }
    
    .login-description {
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
      line-height: 1.5;
    }
    
    .oauth-btn {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
    }
    
    .oauth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
    }
    
    .oauth-btn:disabled {
      opacity: 0.7;
      transform: none;
      cursor: not-allowed;
    }

    /* 已登录状态 */
    .user-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #e9ecef;
    }
    
    .workspace-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    
    .workspace-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #ddd;
    }
    
    .workspace-details h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    
    .workspace-details p {
      margin: 2px 0 0 0;
      font-size: 12px;
      color: #666;
    }
    
    .logout-btn {
      background: #f5f5f5;
      border: 1px solid #ddd;
      color: #666;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .logout-btn:hover {
      background: #e9ecef;
      color: #495057;
    }

    /* 页面管理区域 */
    .page-management {
      margin-bottom: 20px;
    }
    
    .manage-pages-btn {
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .manage-pages-btn:hover {
      background: #0056b3;
    }

    /* 默认页面显示 */
    .default-page-section {
      margin-bottom: 20px;
    }
    
    .default-page-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }
    
    .current-page-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: white;
      border: 1px solid #e9ecef;
      border-radius: 6px;
    }
    
    .page-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    
    .page-icon {
      font-size: 16px;
    }
    
    .page-title {
      font-size: 14px;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .change-page-btn {
      background: none;
      border: none;
      color: #007bff;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }
    
    .change-page-btn:hover {
      background: #f8f9fa;
    }

    /* 内容预览 */
    .preview {
      margin-bottom: 20px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e9ecef;
      display: none;
    }
    
    .preview-title {
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
      font-size: 14px;
    }
    
    .preview-content {
      color: #666;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    
    .preview-images {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .preview-image {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #e9ecef;
    }

    /* 剪藏按钮 */
    .clip-section {
      margin-bottom: 10px;
    }
    
    .clip-btn {
      width: 100%;
      background: #28a745;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .clip-btn:hover:not(:disabled) {
      background: #218838;
      transform: translateY(-1px);
    }
    
    .clip-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
      transform: none;
    }

    /* 页面管理抽屉 */
    .page-drawer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
    }
    
    .drawer-content {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 380px;
      background: white;
      box-shadow: -4px 0 12px rgba(0, 0, 0, 0.15);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    
    .page-drawer.show .drawer-content {
      transform: translateX(0);
    }
    
    .drawer-header {
      padding: 20px;
      border-bottom: 1px solid #e9ecef;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .drawer-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin: 0;
    }
    
    .close-drawer {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
      padding: 5px;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }
    
    .close-drawer:hover {
      background: #e9ecef;
    }
    
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* 管理页面列表 */
    .managed-pages-section {
      margin-bottom: 30px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
    }
    
    .managed-page-item {
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      margin-bottom: 8px;
      background: white;
    }
    
    .managed-page-item.default {
      border-color: #007bff;
      background: #f8f9ff;
    }
    
    .managed-page-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    
    .managed-page-title {
      font-size: 14px;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .managed-page-actions {
      display: flex;
      gap: 6px;
    }
    
    .set-default-btn, .remove-page-btn {
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .set-default-btn {
      background: #e7f3ff;
      color: #007bff;
    }
    
    .set-default-btn:hover {
      background: #cce7ff;
    }
    
    .remove-page-btn {
      background: #ffebee;
      color: #c62828;
    }
    
    .remove-page-btn:hover {
      background: #ffcdd2;
    }

    /* 添加页面区域 */
    .add-pages-section {
      border-top: 1px solid #e9ecef;
      padding-top: 20px;
    }
    
    .page-search {
      margin-bottom: 15px;
    }
    
    .page-search input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    
    .page-search input:focus {
      outline: none;
      border-color: #007bff;
    }
    
    .available-pages {
      max-height: 300px;
      overflow-y: auto;
    }
    
    .available-page-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
    }
    
    .available-page-item:hover {
      border-color: #007bff;
      background: #f8f9ff;
    }
    
    .available-page-item.added {
      border-color: #28a745;
      background: #f8fff8;
    }
    
    .loading-state, .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">Red To Notion</h1>
  </div>
  
  <div class="main-content">
    <div id="status" class="status info">正在检查登录状态...</div>
    
    <!-- 未登录状态 -->
    <div id="loginSection" class="login-section" style="display: none;">
      <div class="login-description">
        一键登录您的 Notion 账号，<br>
        安全便捷地剪藏小红书内容
      </div>
      <button id="oauthBtn" class="oauth-btn">
        🚀 一键登录 Notion
      </button>
    </div>
    
    <!-- 已登录状态 -->
    <div id="loggedInSection" style="display: none;">
      <!-- 用户信息 -->
      <div class="user-info">
        <div class="workspace-info">
          <img id="workspaceIcon" class="workspace-icon" src="" alt="">
          <div class="workspace-details">
            <h3 id="workspaceName">工作区</h3>
            <p>已连接</p>
          </div>
        </div>
        <button id="logoutBtn" class="logout-btn">退出登录</button>
      </div>
      
      <!-- 页面管理 -->
      <div class="page-management">
        <button id="managePagesBtn" class="manage-pages-btn">
          ⚙️ 管理可访问页面
        </button>
      </div>
      
      <!-- 默认页面显示 -->
      <div id="defaultPageSection" class="default-page-section" style="display: none;">
        <div class="default-page-label">当前默认页面：</div>
        <div class="current-page-display">
          <div class="page-info">
            <span id="defaultPageIcon" class="page-icon">📄</span>
            <span id="defaultPageTitle" class="page-title">请先添加页面</span>
          </div>
          <button id="changePageBtn" class="change-page-btn">更换</button>
        </div>
      </div>
      
      <!-- 内容预览 -->
      <div id="preview" class="preview">
        <div class="preview-title" id="previewTitle"></div>
        <div class="preview-content" id="previewContent"></div>
        <div class="preview-images" id="previewImages"></div>
      </div>
      
      <!-- 剪藏按钮 -->
      <div class="clip-section">
        <button id="clipBtn" class="clip-btn" disabled>
          📎 剪藏到 Notion
        </button>
      </div>
    </div>
  </div>

  <!-- 页面管理抽屉 -->
  <div id="pageDrawer" class="page-drawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <h3 class="drawer-title">管理可访问页面</h3>
        <button class="close-drawer" id="closeDrawer">&times;</button>
      </div>
      <div class="drawer-body">
        <!-- 已管理的页面 -->
        <div class="managed-pages-section">
          <div class="section-title">已添加的页面</div>
          <div id="managedPagesList">
            <div class="empty-state" id="noManagedPages">
              还没有添加任何页面<br>
              <small>请在下方搜索并添加页面</small>
            </div>
          </div>
        </div>
        
        <!-- 添加新页面 -->
        <div class="add-pages-section">
          <div class="section-title">添加新页面</div>
          <div class="page-search">
            <input type="text" id="pageSearchInput" placeholder="搜索 Notion 页面...">
          </div>
          <div class="available-pages">
            <div id="loadingPages" class="loading-state">正在加载页面...</div>
            <div id="availablePagesList" style="display: none;"></div>
            <div id="emptyPages" class="empty-state" style="display: none;">
              没有找到页面<br>
              <small>请确保您的 Notion 工作区中有页面</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="dist/popup.js"></script>
</body>
</html>
