<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }
    .status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
    }
    .status.info {
      background-color: #e3f2fd;
      color: #1976d2;
    }
    .status.success {
      background-color: #e8f5e8;
      color: #2e7d32;
    }
    .status.error {
      background-color: #ffebee;
      color: #c62828;
    }
    .preview {
      margin-bottom: 15px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 8px;
      display: none;
    }
    .preview-title {
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    .preview-content {
      color: #666;
      font-size: 14px;
      max-height: 100px;
      overflow: hidden;
    }
    .preview-images {
      margin-top: 10px;
    }
    .preview-image {
      width: 60px;
      height: 60px;
      object-fit: cover;
      margin-right: 5px;
      border-radius: 4px;
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .clip-btn {
      background-color: #ff2442;
      color: white;
    }
    .clip-btn:hover {
      background-color: #e01e3c;
    }
    .clip-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .settings-btn {
      background-color: #f0f0f0;
      color: #333;
    }
    .settings-btn:hover {
      background-color: #e0e0e0;
    }
    .settings-panel {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .save-btn {
      background-color: #4caf50;
      color: white;
      width: 100%;
    }
    .save-btn:hover {
      background-color: #45a049;
    }
    
    /* OAuth 和页面选择相关样式 */
    .auth-section {
      margin-bottom: 15px;
      padding: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fafafa;
    }
    
    .auth-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    
    .workspace-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .workspace-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }
    
    .workspace-name {
      font-weight: bold;
      color: #333;
    }
    
    .oauth-btn {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .oauth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
    }
    
    .logout-btn {
      background: #f5f5f5;
      color: #666;
      font-size: 12px;
      padding: 6px 12px;
    }
    
    .logout-btn:hover {
      background: #e5e5e5;
      color: #333;
    }
    
    /* 页面选择器样式 */
    .page-selector {
      margin-bottom: 15px;
    }
    
    .page-selector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    
    .page-search {
      margin-bottom: 10px;
    }
    
    .page-search input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    
    .selected-page {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .selected-page:hover {
      border-color: #ff6b35;
      background: #fff7f5;
    }
    
    .page-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
    }
    
    .page-title {
      flex: 1;
      font-size: 14px;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .change-page-btn {
      font-size: 12px;
      color: #666;
      text-decoration: none;
    }
    
    /* 抽屉式页面选择器 */
    .page-drawer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
    }
    
    .drawer-content {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 320px;
      background: white;
      box-shadow: -4px 0 12px rgba(0, 0, 0, 0.15);
      transform: translateX(100%);
      transition: transform 0.3s ease;
    }
    
    .page-drawer.show .drawer-content {
      transform: translateX(0);
    }
    
    .drawer-header {
      padding: 20px;
      border-bottom: 1px solid #e5e5e5;
      background: #f8f9fa;
    }
    
    .drawer-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin: 0;
    }
    
    .close-drawer {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #666;
      padding: 5px;
    }
    
    .drawer-body {
      padding: 20px;
      height: calc(100vh - 140px);
      overflow-y: auto;
    }
    
    .page-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .page-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
    }
    
    .page-item:hover {
      border-color: #ff6b35;
      background: #fff7f5;
    }
    
    .page-item.selected {
      border-color: #ff6b35;
      background: #fff7f5;
    }
    
    .page-item-icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }
    
    .page-item-info {
      flex: 1;
      min-width: 0;
    }
    
    .page-item-title {
      font-weight: 500;
      color: #333;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .page-item-date {
      font-size: 12px;
      color: #888;
    }
    
    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #666;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Red To Notion</div>
  </div>
  
  <div id="status" class="status info">
    Please use this tool on Xiaohongshu post pages
  </div>
  
  <div id="preview" class="preview">
    <div class="preview-title" id="previewTitle"></div>
    <div class="preview-content" id="previewContent"></div>
    <div class="preview-images" id="previewImages"></div>
  </div>
  
  <!-- OAuth 授权区域 -->
  <div class="auth-section">
    <div id="authStatus" class="auth-status">
      <div id="notLoggedIn" style="display: none;">
        <button id="oauthBtn" class="oauth-btn">🚀 一键登录 Notion</button>
      </div>
      <div id="loggedIn" style="display: none;">
        <div class="workspace-info">
          <img id="workspaceIcon" class="workspace-icon" src="" alt="">
          <span id="workspaceName" class="workspace-name"></span>
        </div>
        <button id="logoutBtn" class="logout-btn">退出登录</button>
      </div>
    </div>
  </div>
  
  <!-- 页面选择器 -->
  <div id="pageSelector" class="page-selector" style="display: none;">
    <div class="page-selector-header">
      <label>选择目标页面：</label>
    </div>
    <div id="selectedPage" class="selected-page">
      <span id="selectedPageIcon" class="page-icon">📄</span>
      <span id="selectedPageTitle" class="page-title">点击选择页面</span>
      <span class="change-page-btn">选择</span>
    </div>
  </div>
  
  <div class="buttons">
    <button id="clipBtn" class="clip-btn" disabled>Clip to Notion</button>
    <button id="settingsBtn" class="settings-btn">Settings</button>
  </div>
  
  <div id="settingsPanel" class="settings-panel">
    <div class="form-group">
      <label for="notionToken">Notion Integration Token:</label>
      <input type="password" id="notionToken" placeholder="Enter your Notion Token">
    </div>
    <div class="form-group">
      <label for="pageId">Page ID:</label>
      <input type="text" id="pageId" placeholder="Enter target Notion page ID">
    </div>
    <button id="saveBtn" class="save-btn">Save Settings</button>
  </div>
  
  <!-- 页面选择抽屉 -->
  <div id="pageDrawer" class="page-drawer">
    <div class="drawer-content">
      <div class="drawer-header">
        <h3 class="drawer-title">选择 Notion 页面</h3>
        <button class="close-drawer" id="closeDrawer">&times;</button>
      </div>
      <div class="drawer-body">
        <div class="page-search">
          <input type="text" id="pageSearchInput" placeholder="搜索页面...">
        </div>
        <div id="pageListContainer">
          <div id="loadingPages" class="loading-state">正在加载页面...</div>
          <div id="pageList" class="page-list" style="display: none;"></div>
          <div id="emptyPages" class="empty-state" style="display: none;">
            <p>没有找到可用的页面</p>
            <small>请确保您的 Notion 工作区中有页面，并且已授权访问权限</small>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="dist/popup.js"></script>
</body>
</html>
